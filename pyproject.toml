[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bifrost-monitor"
version = "0.2.0"
description = "Zero-config AI agent observability — one decorator, local SQLite, instant insights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jarrad Bermingham", email = "jarrad.bermingham98@gmail.com" },
]
keywords = ["ai", "monitoring", "observability", "agents", "llm", "decorator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
bifrost-monitor = "bifrost_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/Jbermingham1/bifrost-monitor"
Repository = "https://github.com/Jbermingham1/bifrost-monitor"
Issues = "https://github.com/Jbermingham1/bifrost-monitor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bifrost_monitor --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
